name: Go SAST Report
on:
  pull_request:
    branches: [main, feat/**, fix/**]

jobs:
  security-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check Build
        run: go build ./...

      # gosec/govulncheck vivem num módulo Go isolado (tools/go.mod), com
      # go.sum próprio pinando versão exata + checksum — não altera o
      # go.mod raiz (fica em 1.24, igual ao Dockerfile de produção). Rodar
      # `go install <pkg>` sem @versão AQUI DENTRO do módulo resolve pelo
      # go.sum local (lock-file), não busca "latest" no proxy a cada run.
      # tools/go.mod exige go>=1.25 — o toolchain switching automático do Go
      # (GOTOOLCHAIN=auto, padrão) baixa 1.25.x só pra este passo, sem afetar
      # o build/test do módulo raiz logo abaixo.
      - name: Install SAST Security Tools
        working-directory: tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec
          go install golang.org/x/vuln/cmd/govulncheck
          echo "$GOPATH/bin" >> $GITHUB_PATH

      # Executa Gosec e gera SARIF
      - name: Run Gosec Security Scan
        run: gosec -fmt=sarif -out=gosec-report.sarif ./... || true

      # Executa govulncheck e gera JSON
      - name: Run Vulnerability Check
        run: govulncheck -json ./... > vulncheck-report.json 2>&1 || true

      # Corrige SARIF para evitar problemas de compatibilidade
      - name: Fix SARIF format
        run: |
          dotnet tool install --global Sarif.Multitool
          export PATH="$PATH:/home/runner/.dotnet/tools"
          sarif rewrite gosec-report.sarif --output valid-gosec-report.sarif

      # Salva relatórios como artifact
      - name: Store All Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-sast-results
          path: |
            gosec-report.sarif
            valid-gosec-report.sarif
            vulncheck-report.json
