name: SonarQube / SonarCloud Scan

on:
  pull_request:
    branches: [main, feat/**, fix/**]

jobs:
  sonar:
    name: Analyze with Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud precisa do histórico completo pra blame/novo-código

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go vet ./... && go test ./... -coverprofile=coverage.out

      # sonarcloud-github-action está deprecated (imagem Docker com Java 17,
      # não suportado pelo SonarQube Cloud desde 20/07/2026) — substituído
      # pela action oficial sonarqube-scan-action, mesma interface (args/env).
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=13soat-andromeda
            -Dsonar.projectKey=13SOAT-andromeda_video-processor-link-api
            -Dsonar.go.coverage.reportPaths=coverage.out
