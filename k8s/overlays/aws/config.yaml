# Valores estáveis, seguros de comitar (não carregam account id nem segredo).
# BASE_URL, STATUS_QUEUE_URL, NOTIFICATION_TOPIC_ARN e DD_VERSION dependem de
# outputs do Terraform (ARN/URL carregam o account id da conta AWS Academy, e
# o endpoint do API Gateway só existe depois do apply do
# iac-video-processor-gateway) — entram via .env.host (gitignored, ver
# .env.host.example), mesclado por configMapGenerator no kustomization.yaml
# deste overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: link-api-config
data:
  PORT: "8080"
  AWS_REGION: "us-east-1"
  DYNAMO_LINKS_TABLE: "video-processor-links-db-prod"
  DYNAMO_EVENTS_TABLE: "video-processor-link-events-db-prod"
  S3_BUCKET: "video-processor-videos-andromeda-prod"
  USE_USER_SVC_MOCK: "false"
  USERS_BASE_URL: "http://video-processor-users-api-svc.default.svc.cluster.local"
  DD_ENV: "prod"
  DD_SERVICE: "video-processor-link-api"
  # AWS_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY ficam de fora
  # de propósito: em produção o pod usa a IAM role do node EKS (LabRole,
  # herdada via metadata do EC2) — nunca credenciais estáticas.
---
apiVersion: v1
kind: Secret
metadata:
  name: link-api-secrets
type: Opaque
stringData:
  # placeholder — substituído de verdade por .env.secrets (gitignored) via
  # secretGenerator (behavior: replace) no kustomization.yaml deste overlay.
  JWT_SECRET: "CHANGE_ME"
